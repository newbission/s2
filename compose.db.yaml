# 6단계용: 로컬 Postgres를 붙인다. 프로토타입 기간에는 쓰지 않는다.
#   docker compose -f compose.yaml -f compose.db.yaml up
# 아래 비밀번호는 이 컨테이너 안에서만 쓰는 개발용 값이다 (실제 시크릿 아님).
services:
  app:
    environment:
      DATABASE_URL: postgres://s2:s2_local_dev@db:5432/s2
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: s2
      POSTGRES_PASSWORD: s2_local_dev
      POSTGRES_DB: s2
    # 앱은 compose 네트워크(db:5432)로 붙는다. 바깥 포트는 DB 도구로 직접 볼 때용이며
    # 다른 Postgres(5432)와 겹치지 않게 흔치 않은 번호. 겹치면 S2_DB_PORT=…
    ports:
      - "127.0.0.1:${S2_DB_PORT:-54747}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U s2 -d s2"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
