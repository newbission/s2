# 개발 환경. 어느 기기든 `docker compose up`이면 같은 Node·pnpm으로 뜬다.
# DATABASE_URL이 없으므로 메모리 목업으로 동작한다 (A56).
# DB까지 띄우려면: docker compose -f compose.yaml -f compose.db.yaml up
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # 잠금 파일이 지난 설치 때와 같으면 설치를 건너뛴다 (뜰 때마다 레지스트리 조회를 피함)
    command: >-
      sh -c "cmp -s pnpm-lock.yaml node_modules/.s2-installed-lock
      || (pnpm install --frozen-lockfile && cp pnpm-lock.yaml node_modules/.s2-installed-lock);
      exec pnpm dev --hostname 0.0.0.0 --port 3000"
    ports:
      # 바깥 포트는 다른 프로젝트와 겹치지 않게 흔치 않은 번호. 겹치면 S2_APP_PORT=… docker compose up
      - "127.0.0.1:${S2_APP_PORT:-34747}:3000"
    volumes:
      - .:/app                      # 소스는 맥 폴더와 공유
      - node_modules:/app/node_modules  # 리눅스용 패키지는 볼륨에 따로 (맥 것과 섞이지 않게)
      - next_cache:/app/.next
    environment:
      npm_config_store_dir: /app/node_modules/.pnpm-store

volumes:
  node_modules:
  next_cache:
