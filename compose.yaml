# 개발 환경. 어느 기기든 `docker compose up`이면 같은 Node·pnpm으로 뜬다.
# DATABASE_URL이 없으므로 메모리 목업으로 동작한다 (A56).
# DB까지 띄우려면: docker compose -f compose.yaml -f compose.db.yaml up
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: sh -c "pnpm install --frozen-lockfile && pnpm dev --hostname 0.0.0.0 --port 3000"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app                      # 소스는 맥 폴더와 공유
      - node_modules:/app/node_modules  # 리눅스용 패키지는 볼륨에 따로 (맥 것과 섞이지 않게)
      - next_cache:/app/.next
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      npm_config_store_dir: /app/node_modules/.pnpm-store

volumes:
  node_modules:
  next_cache:
